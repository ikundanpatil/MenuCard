<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe Menu</title>
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body>
    <div class="menu">
      <div class="left">
        <div class="logo">
          <img src="logo star buks.jpg" alt="LOGO" />
        </div>

        <h1>OUR MENU</h1>

        <div class="coffee-section">
          <!-- <iframe src="right.html"></iframe> -->
          <h2>COFFEE</h2>

          <div class="items">
            <p>Espresso <span>$9</span></p>
            <p>Americano <span>$8</span></p>
            <p>Latte <span>$9</span></p>
            <p>Cappuccino <span>$8</span></p>
            <p>Mocha <span>$9</span></p>
          </div>
        </div>

        <div class="image1 matcha">
          <img src="download (4).jpg" alt="Drink" />
        </div>

        <div class="desserts">
          <h2>DESSERTS</h2>

          <div class="items">
            <p>Chocolate Cake <span>$9</span></p>
            <p>Carrot Cake <span>$8</span></p>
            <p>Cheesecake <span>$9</span></p>
          </div>
        </div>

        <div class="footer">
          <div class="social">🌐 ☎ ✉</div>
          <p>thebrewmatchashop</p>
        </div>
      </div>

      <div class="right">
        <div class="image1 coffee">
          <img src="Is coffee good for the heart_.jpg" alt="Coffee-img" />
        </div>
        <div class="non-coffee">
          <h2>NON COFFEE</h2>

          <div class="items">
            <p>Hot Chocolate <span>$9</span></p>
            <p>MilkShake <span>$8</span></p>
            <p>Smoothie <span>$9</span></p>
            <p>Lemonade <span>$8</span></p>
            <p>Fruit Juice <span>$9</span></p>
          </div>
          <div class="image1 dessert">
            <img src="Festival of Winter Walks.jpg" alt="Dessert-img" />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
